name: cps853-data-platform

services:
  kafka:
    build:
      context: .
      dockerfile: docker/kafka/Dockerfile
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    
    environment:
      KAFKA_NODE_ID: 1 
      KAFKA_PROCESS_ROLES: broker, controller # controller required even for single broker setup
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093 
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 # address availble to clients trying to reach the broker
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # single value since only one broker

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  kafka-volume-init:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    volumes:
      - kafka_data:/kafka-data
    command:
      - sh
      - -c
      - "mkdir -p /kafka-data && chown -R 1000:1000 /kafka-data"
  
  # Database service for serving analytical results
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gold_layer_pm25
      POSTGRES_USER: bigdata24/7
      POSTGRES_PASSWORD: BigDataAllDay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  db-init:
    image: postgres:17
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: gold_layer_pm25
      PGUSER: "bigdata24/7"
      PGPASSWORD: BigDataAllDay

    volumes:
      - ./sql:/sql:ro

    entrypoint: ["/bin/sh", "-ec"]
    command: 
      - |
        for file in /sql/[0-9][0-9][0-9]_*.sql; do
          [ -f "$$file" ] || continue
          echo "Applying $$file"
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$$file"
        done
  
  kafka-init:
    image: apache/kafka:4.1.2
    profiles: ["pipeline"]
    restart: no
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:9092 \
        --create --if-not-exists \
        --topic pm25-hourly \
        --partitions 3 \
        --replication-factor 1
  dimension-loader:
    build:
      context: .
      dockerfile: docker/python/Dockerfile

    profiles: ["pipeline"]
    restart: "no"

    depends_on:
      db-init:
        condition: service_completed_successfully

    working_dir: /app

    environment:
      PARQUET_GLOB: /app/data/silver/pm25_hourly/*.parquet
      PYTHONPATH: /app
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: gold_layer_pm25
      PGUSER: bigdata24/7
      PGPASSWORD: BigDataAllDay

    volumes:
      - ./data/silver:/app/data/silver:ro
      - ./src:/app/src:ro

    command: ["python", "-m", "src.database.load_dimensions"]
  
  spark-batch:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    group_add:
      - "1000"
    profiles: ["pipeline"]
    restart: "no"
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - --conf
      - spark.sql.shuffle.partitions=8
      - /app/src/spark-batch/job.py
  spark-gold:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    profiles: ["pipeline"]
    restart: "no"

    depends_on:
      spark-batch:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully

    environment:
      SILVER_PARQUET_PATH: /app/data/silver/pm25_hourly

      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: gold_layer_pm25
      PGUSER: "bigdata24/7"
      PGPASSWORD: BigDataAllDay

    volumes:
      - ./data/silver:/app/data/silver:ro
      - ./src:/app/src:ro

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - --conf
      - spark.sql.shuffle.partitions=8
      - --conf
      - spark.jars.ivy=/tmp
      - --packages
      - org.postgresql:postgresql:42.7.14
      - /app/src/spark-gold/job.py
  
  consumer:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    profiles: ["pipeline"]
    restart: "no"

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      spark-checkpoint-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: pm25-hourly

      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: gold_layer_pm25
      PGUSER: "bigdata24/7"
      PGPASSWORD: BigDataAllDay

    volumes:
      - ./src:/app/src:ro
      - spark_checkpoints:/app/checkpoints

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - --conf
      - spark.sql.shuffle.partitions=8
      - --conf
      - spark.jars.ivy=/tmp
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.1
      - /app/src/kafka-streaming/consumer.py
  spark-checkpoint-init:
    image: alpine:3.20
    user: "0:0"
    profiles: ["pipeline"]
    restart: "no"

    volumes:
      - spark_checkpoints:/app/checkpoints

    command:
      - sh
      - -c
      - "chown -R 185:185 /app/checkpoints"
    
  producer:
      build:
        context: .
        dockerfile: docker/python/Dockerfile
      profiles: ["pipeline"]
      restart: "no"
      depends_on:
        spark-batch:
          condition: service_completed_successfully
        kafka-init:
          condition: service_completed_successfully
      working_dir: /app
      environment:
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        KAFKA_TOPIC: pm25-hourly
        PYTHONPATH: /app
        PARQUET_GLOB: /app/data/silver/pm25_hourly/*.parquet
        REPLAY_SPEED: "0"
        MAX_EVENTS: "0"
      volumes:
        - ./data/silver:/app/data/silver:ro
        - ./src:/app/src:ro
      command: ["python", "-m", "src.kafka-streaming.producer"]

volumes:
  kafka_data:
  postgres_data:
  spark_checkpoints:






      